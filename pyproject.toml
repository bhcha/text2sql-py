[project]
name = "t2s"
version = "0.1.0"
description = "P3 text-to-SQL 파이프라인과 데이터 연결 하네스 (Python)"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    "numpy>=2.5,<3",
    "onnxruntime>=1.31,<2",
    "tokenizers>=0.23,<1",
]

[project.scripts]
t2s = "t2s.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# 공식 채점기가 모듈 첫머리에서 불러오는 셋(TS benchmarks/vendor/requirements.lock.txt와 같은 판).
# 채점 하위 프로세스만 쓰고 t2s 생성 쪽은 import하지 않는다. 새 클론의 `uv run` 한 번으로 깔리게 기본 그룹에 넣는다.
eval = ["func-timeout==4.3.5", "psycopg2-binary==2.9.13", "PyMySQL==1.2.3"]

[tool.uv]
default-groups = ["dev", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bird: 받아 둔 BIRD 자료가 있어야 도는 테스트(없으면 건너뜀)",
    "model: 임베딩 모델 파일이 있어야 도는 테스트(없으면 건너뜀)",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
# 문서 안의 Python 예시 상자는 서식 검사에서 뺀다(설명용 꼴이다). 공식 채점기 사본은 고치지 않으므로 뺀다.
extend-exclude = ["*.md", "src/t2s/eval/vendor"]
